name: Перевірки
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Встановлення uv
        run: python -m pip install uv==0.12.14
      - name: Встановлення проєкту
        run: uv sync --locked
      - name: Перевірка коду та тестів
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
