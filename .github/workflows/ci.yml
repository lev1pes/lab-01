name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Збірка контейнера та перевірка HTTP
        run: |
          docker build -t findex:lab07 .
          test "$(docker inspect --format '{{.Config.User}}' findex:lab07)" = findex
          docker run -d --memory=512m --name findex-test -e INDEX_PATH=/app/data/web-index.json -p 8000:8000 findex:lab07
          for attempt in $(seq 1 60); do
            if curl --fail http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health
          curl --fail 'http://127.0.0.1:8000/search?q=python'
          curl --fail 'http://127.0.0.1:8000/search?q=automated%20boilerplate&mode=hybrid&k=5'
          docker logs findex-test
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13t"]
    steps:
      - uses: actions/checkout@v4
      - name: Встановлення uv та Python
        run: |
          python -m pip install uv==0.12.14
          uv python install ${{ matrix.python }}
      - name: Встановлення проєкту
        if: matrix.python == '3.12'
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Free-threaded оточення та сумісні тестові інструменти
        if: matrix.python == '3.13t'
        run: |
          uv sync --locked --no-dev --python 3.13t
          uv pip install pytest==9.1.1 pytest-cov==7.1.0 hypothesis==6.135.26 pytest-benchmark==5.3.0
      - name: Перевірка режиму GIL
        if: matrix.python == '3.13t'
        run: uv run --no-sync python -c "import sys, hypothesis; print(sys._is_gil_enabled()); assert not sys._is_gil_enabled()"
      - name: Стиль, типи та тести
        if: matrix.python == '3.12'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest --cov=findex --cov-report=term-missing --cov-fail-under=90
      - name: Повний набір тестів без GIL
        if: matrix.python == '3.13t'
        run: uv run --no-sync pytest --cov=findex --cov-report=term-missing --cov-fail-under=90
      - name: Wheel у чистому оточенні поза репозиторієм
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/findex-smoke" --python ${{ matrix.python }}
          uv pip install --python "$RUNNER_TEMP/findex-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          findex-smoke/bin/findex --help

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install uv==0.12.14
      - run: uv sync --locked --python 3.12
      - uses: actions/cache@v4
        with:
          path: .benchmarks
          key: perf-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            perf-${{ runner.os }}-${{ github.ref_name }}-
      - name: Search та build — поріг регресії медіани 50%
        run: |
          comparison=()
          if find .benchmarks -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            comparison=(--benchmark-compare --benchmark-compare-fail=median:50%)
          fi
          uv run pytest tests/test_performance_semantic.py -k benchmark --benchmark-only --benchmark-autosave --benchmark-min-rounds=20 --benchmark-json=benchmark.json "${comparison[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance
          path: benchmark.json
