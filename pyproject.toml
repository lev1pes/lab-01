[project]
name = "findex"
version = "0.5.0"
description = "findex: інвертований індекс і ранжований пошук з командного рядка"
readme = "README.md"
authors = [
    { name = "lev1pes", email = "96699273+lev1pes@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: перевірки, що тривають понад секунду"]

[tool.pyright]
include = ["src/findex"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["findex"]

[tool.coverage.report]
show_missing = true
